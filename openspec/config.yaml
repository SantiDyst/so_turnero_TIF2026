schema: spec-driven

context: |
  Project: SO Turnero, greenfield API-first backend for an academic occupational-health appointment MVP.
  Planned stack: TypeScript, NestJS, Prisma, administered PostgreSQL, and Vercel backend deployment.
  Architecture: API-first backend; no frontend in this stage. Application code covers registration, queue/query, and one professional attention.
  Source specifications: docs/requisitos/ contains requirements, use cases, user stories, and conceptual maps.
  Testing: Jest with ts-jest runs unit, isolated-schema integration, and HTTP E2E tests; strict TDD remains disabled.
  Conventions: English SDD artifacts; preserve source requirements and use OpenSpec file artifacts.

strict_tdd: false

testing:
  detected: "2026-10-17"
  strict_tdd: false
  reason: "Jest and ts-jest are installed for standard-mode testing. Strict TDD remains disabled by approved task scope."
  runner:
    available: true
    command: "npm test"
    framework: "Jest 29 + ts-jest"
  layers:
    unit: { available: true, tool: "Jest mocks" }
    integration: { available: true, tool: "Jest + isolated Neon test_ schema" }
    e2e: { available: true, tool: "Jest + supertest + isolated Neon test_ schema" }
  coverage:
    available: false
    command: ""
  quality:
    linter: { available: false, command: "" }
    type_checker: { available: false, command: "" }
    formatter: { available: false, command: "" }

rules:
  proposal:
    - Include rollback plans for risky changes.
    - Trace scope to the source documents in docs/requisitos/.
  specs:
    - Use Given/When/Then scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
  design:
    - Document architecture decisions with rationale.
    - Include sequence diagrams for complex flows.
  tasks:
    - Group tasks by phase with hierarchical numbering.
    - Keep tasks completable in one session.
  apply:
    - Follow the approved design and existing project conventions.
    tdd: false
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
